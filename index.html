/* ---------- body ---------- */
function body(sex,v,c,plm){
 const f=sex==='f',M=v==='f'?FR:BK,sil=f?SF:SM;
 const mir=(d,a)=>`<path d="${d}" ${a}/><path d="${d}" transform="translate(200 0) scale(-1 1)" ${a}/>`;
 let s=`<svg viewBox="0 0 200 392" preserveAspectRatio="xMidYMid meet"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--b1)"/><stop offset="1" style="stop-color:var(--b2)"/></linearGradient><filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
 s+=mir(sil,'fill="url(#bg)" stroke="rgba(255,255,255,.35)" stroke-width="1.6"')+mir(sil,'fill="url(#bg)"');
 s+=`<ellipse cx="100" cy="22" rx="13" ry="17" fill="url(#bg)" stroke="rgba(255,255,255,.35)" stroke-width=".8"/>`;
 if(v==='f')s+=mir('M101 64C112 62 126 63 140 69','class="ln"');
 for(const k in M){const sc=f?(FSC[k]||1):1,n=c[k]||0,l=n?Math.min(3,Math.ceil(n/3)):0,cl=l?'l'+l:plm.has(k)?'pl':'';s+=`<g transform="translate(${(100*(1-sc)).toFixed(1)} 0) scale(${sc} 1)">`+(l?mir(M[k],`fill="none" stroke="var(--m${l})" stroke-width="5" stroke-opacity=".35" stroke-linejoin="round" pointer-events="none"`):'')+mir(M[k],`class="mu ${cl}" data-m="${k}"`)+'</g>'}
 return s+'</svg>';
}
function streak(p){const days=new Set(p.logs.map(l=>l.d));let d=new Date(),n=0;if(!days.has(dstr(d)))d.setDate(d.getDate()-1);while(days.has(dstr(d))){n++;d.setDate(d.getDate()-1)}return n}
const dayPlan=(p,wd)=>p.plan[wd]||{ms:[],ex:[]};
const planName=pl=>pl.ms.length?pl.ms.map(k=>MU[k][0]).join(' + '):'Rest day';
const setTxt=ss=>{const same=ss.every(x=>x.r===ss[0].r&&x.k===ss[0].k);return same?`${ss.length} × ${ss[0].r}${ss[0].k?' @ '+ss[0].k+' kg':''}`:ss.map(x=>x.r+(x.k?'×'+x.k:'')).join(', ')};
function goals(p){const w=+p.w,h=+p.h,a=+p.age;let k=2200,pr=120;if(w)pr=Math.round(w*1.8);if(w&&h&&a)k=Math.round((10*w+6.25*h-5*a+(p.sex==='f'?-161:5))*1.55/10)*10;return{k:+p.gk||k,p:+p.gp||pr,ak:k,ap:pr}}

 const p=P(),t=today(),logs=p.logs.filter(l=>l.d===t),c={};
 logs.forEach(l=>c[l.m]=(c[l.m]||0)+l.sets.length);

 </div>

 <div class="stats"><div class="stat"><b>${sets}</b><span>Sets today</span></div><div class="stat"><b>${streak(p)}</b><span>Day streak</span></div><div class="stat"><b>${Math.max(0,g.k-eaten)}</b><span>kcal left</span></div></div>

 ${pl.ex.length?`<div class="grp">${pl.ex.map(x=>{const d=logs.some(l=>l.e===x.e);return `<button class="li" onclick='openLog({m:"${x.m}",e:${JSON.stringify(x.e)},sets:${JSON.stringify(x.sets)}})'><div class="chk ${d?'d':''}">${d?'✓':''}</div><div class="g"><b>${esc(x.e)}</b><small>${MU[x.m][0]} · ${setTxt(x.sets)}</small></div><span class="tint">${d?'Again':'Start'}</span></button>`}).join('')}</div>`:`<div class="grp"><div class="empty">${pl.ms.length?'Add exercises to this day in the Plan tab.':'Nothing planned. Plan this day in the Plan tab, or tap a muscle to log anything.'}</div></div>`}
 <h3>Logged today</h3>
 ${logs.length?`<div class="grp">${logs.map(logRow).join('')}</div>`:'<div class="grp"><div class="empty">No exercises yet. Tap a muscle or +.</div></div>'}`;
}

function lastOf(e){const l=[...P().logs].reverse().find(x=>x.e===e);return l?clone(l.sets):null}
function openLog(o){
 LG=Object.assign({step:'pick',m:'chest',e:'',sets:[],id:null,mode:'log',idx:null},o);
 if(LG.e){LG.step='sets';LG.direct=1;if(!LG.sets.length)LG.sets=lastOf(LG.e)||[{r:10,k:0},{r:10,k:0},{r:10,k:0}]}

  <h3>Something else</h3><div class="grp"><div class="li"><input id="ce" class="r" style="text-align:left;color:inherit" placeholder="Custom exercise name"><button class="tint" onclick="pickCustom()">Next</button></div></div>`;
 }else{
  const back=LG.direct;
  b.innerHTML=`<div class="gr"></div><div class="nb"><button onclick="${back?'closeSheet()':"LG.step='pick';drawLog()"}">${back?'Cancel':'‹ Back'}</button><b>${esc(LG.e)}</b><button onclick="saveLog()">${LG.mode==='plan'?'Add':'Save'}</button></div>
  <div class="cap" style="text-align:center;margin:-6px 0 10px">${MU[LG.m][0]}${LG.mode==='plan'?' · planned sets':''}</div>
  <div class="colh"><span style="width:46px">Set</span><span style="flex:1;text-align:center">Reps</span><span style="flex:1;text-align:center">Weight (kg)</span><span style="width:26px"></span></div>
  <div class="grp sr">${LG.sets.map((s,i)=>`<div class="li"><span class="mut" style="width:46px">${i+1}</span>${stp(i,'r',1)}${stp(i,'k',2.5)}<button class="mut" style="width:26px;font-size:18px" onclick="rmSet(${i})" aria-label="Remove set">✕</button></div>`).join('')}</div>
  <button class="btn alt" onclick="addSet()">+ Add set</button>
  ${LG.id?'<button class="btn alt red" onclick="delLog()">Delete exercise</button>':''}`;
 }
}
function stp(i,f,d){return `<div class="st" style="flex:1;justify-content:center"><button onclick="bump(${i},'${f}',${-d})" aria-label="Decrease">−</button><input type="number" inputmode="decimal" value="${LG.sets[i][f]}" onchange="LG.sets[${i}].${f}=Math.max(0,+this.value||0)"><button onclick="bump(${i},'${f}',${d})" aria-label="Increase">+</button></div>`}
function bump(i,f,d){const s=LG.sets[i];s[f]=Math.max(0,Math.round((s[f]+d)*10)/10);drawLog()}
function addSet(){const l=LG.sets[LG.sets.length-1]||{r:10,k:0};LG.sets.push({r:l.r,k:l.k});drawLog()}
function rmSet(i){LG.sets.splice(i,1);if(!LG.sets.length)LG.sets.push({r:10,k:0});drawLog()}
function saveLog(){
 const p=P(),sets=LG.sets.filter(s=>s.r>0);if(!sets.length){alert('Add at least one set with reps.');return}
 if(LG.mode==='plan'){const d=p.plan[LG.day]=p.plan[LG.day]||{ms:[],ex:[]},x={m:LG.m,e:LG.e,sets};if(LG.idx!==null)d.ex[LG.idx]=x;else d.ex.push(x);if(!d.ms.includes(LG.m))d.ms.push(LG.m)}
 else if(LG.id){p.logs.find(x=>x.id===LG.id).sets=sets}

 if(FS.f){const f=FS.f;
  b.innerHTML=`<div class="gr"></div><div class="nb"><button onclick="FS.f=null;drawFood()">‹ Back</button><b>${f.custom?'Custom food':esc(f.n)}</b><button onclick="addFood()">Add</button></div>
  ${f.custom?`<input class="tf" id="cn" placeholder="Food name" value="${esc(f.n)}"><input class="tf" id="cs" placeholder="Serving (e.g. 1 bowl)" value="${esc(f.s)}"><input class="tf" id="ck" type="number" inputmode="decimal" placeholder="Calories per serving" value="${f.k||''}"><input class="tf" id="cp" type="number" inputmode="decimal" placeholder="Protein (g) per serving" value="${f.p||''}">`:`<div class="cap" style="text-align:center">per ${esc(f.s)} · ${f.k} kcal · ${f.p} g protein</div>`}
  <div class="grp" style="margin-top:12px"><div class="li"><span class="g">Servings</span><div class="st"><button onclick="qty(-.5)">−</button><input type="number" inputmode="decimal" value="${FS.qty}" onchange="FS.qty=Math.max(.25,+this.value||1);drawFood()"><button onclick="qty(.5)">+</button></div></div></div>
  <div class="grp big" style="margin-top:12px"><b>${f.custom?'—':Math.round(f.k*FS.qty)+' kcal'}</b><span class="mut">${f.custom?'Totals are calculated when you add it':Math.round(f.p*FS.qty*10)/10+' g protein'}</span></div>
  <div class="seg" style="margin-top:12px">${MEALS.map(m=>`<button class="${FS.meal===m?'on':''}" onclick="FS.meal='${m}';drawFood()">${m}</button>`).join('')}</div>`;
  return}
 const cats=['All',...(P().cf.length?['My foods']:[]),...new Set(FOODS.map(f=>f.c))];
 b.innerHTML=`<div class="gr"></div><div class="nb"><button onclick="closeSheet()">Cancel</button><b>Add food</b><span style="min-width:60px"></span></div>
 <input class="search" type="search" placeholder="Search ${FOODS.length}+ foods" value="${esc(FS.q)}" oninput="FS.q=this.value;fl()">
 <div class="chips" style="margin-bottom:8px">${cats.map(c=>`<button class="chip ${FS.cat===c?'on':''}" onclick="FS.cat=this.dataset.c;drawFood()" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div><div id="fl"></div>`;fl();
}
function fl(){
 const q=FS.q.toLowerCase().trim(),p=P(),A=allFoods();let L=A;
 if(FS.cat!=='All')L=L.filter(f=>f.c===FS.cat);
 if(q)L=L.filter(f=>f.n.toLowerCase().includes(q));
 let h='';
 if(!q&&FS.cat==='All'){const seen=new Set(),rec=[];Object.keys(p.food).sort().reverse().forEach(d=>[...p.food[d]].reverse().forEach(e=>{if(!seen.has(e.n)&&rec.length<6){seen.add(e.n);const f=A.find(x=>x.n===e.n);if(f)rec.push(f)}}));
  if(rec.length)h+=`<h3>Recent</h3><div class="grp">${rec.map(f=>frow(f,A)).join('')}</div>`}
 h+=`<h3>${q?'Results':esc(FS.cat)}</h3><div class="grp">${L.slice(0,120).map(f=>frow(f,A)).join('')}<button class="li tint" onclick="newFood()">+ Create custom food${q?' “'+esc(FS.q)+'”':''}</button></div>`;
 document.getElementById('fl').innerHTML=h;
}
function frow(f,A){return `<button class="li" onclick="pickFood(${A.indexOf(f)})"><div class="g"><b>${esc(f.n)}</b><small>${esc(f.s)} · ${f.p} g protein</small></div><span>${f.k}</span></button>`}
function pickFood(i){FS.f=allFoods()[i];FS.qty=1;drawFood()}
function newFood(){FS.f={n:FS.q,s:'1 serving',k:0,p:0,custom:1};FS.qty=1;drawFood()}
function qty(d){FS.qty=Math.max(.25,Math.round((FS.qty+d)*100)/100);drawFood()}
function addFood(){
 const p=P();let f=FS.f;
 if(f.custom){const n=document.getElementById('cn').value.trim();if(!n){alert('Enter a name for the food.');return}
  f={n,s:document.getElementById('cs').value.trim()||'1 serving',k:+document.getElementById('ck').value||0,p:+document.getElementById('cp').value||0,c:'My foods'};p.cf.unshift(f)}
 (p.food[fdate]=p.food[fdate]||[]).push({id:'f'+uid(),n:f.n,s:f.s,q:FS.qty,k:Math.round(f.k*FS.qty),p:Math.round(f.p*FS.qty*10)/10,meal:FS.meal});
 save();closeSheet();render();
}

/* ---------- Profile ---------- */
function viewProfile(){
 const p=P(),g=goals(p),bmi=p.h&&p.w?(p.w/Math.pow(p.h/100,2)).toFixed(1):null,wl=p.wl,delta=wl.length>1?wl[wl.length-1].w-wl[0].w:null;
 const row=(l,k,t,u,ph)=>`<label class="li"><span>${l}</span><input class="r" type="${t}" inputmode="${t==='number'?'decimal':'text'}" value="${esc(p[k]||'')}" placeholder="${esc(ph||u||'')}" onchange="upd('${k}',this.value,0)"></label>`;
 return `<div class="lt"><h1>Profile</h1></div>${S.fresh?'<div class="grp" style="margin-top:8px"><div class="empty">Welcome. Fill in your details so the body map and goals fit you.</div></div>':''}
 <h3>You</h3><div class="grp">${row('Name','name','text')}<div class="li"><span class="g">Body type</span><div class="seg" style="width:150px"><button class="${p.sex==='m'?'on':''}" onclick="upd('sex','m',1)">Male</button><button class="${p.sex==='f'?'on':''}" onclick="upd('sex','f',1)">Female</button></div></div>${row('Age','age','number','years')}${row('Height','h','number','cm')}${row('Weight','w','number','kg')}</div>
 ${bmi?`<div class="cap" style="margin:8px 16px">BMI ${bmi}${delta!==null?` · ${delta>0?'+':''}${delta.toFixed(1)} kg since you started`:''}</div>`:''}
 <h3>Appearance</h3><div class="grp"><div class="li" style="justify-content:space-between;padding:14px 12px">${THEMES.map(([id,n,g])=>`<button class="sw" onclick="setTheme('${id}')" aria-label="${n}"><i class="${TH.t===id?'on':''}" style="background:${g}"></i>${n}</button>`).join('')}</div><div class="li"><span class="g">Background</span><div class="seg" style="width:190px">${BGS.map(([id,n])=>`<button class="${TH.b===id?'on':''}" onclick="setBg('${id}')">${n}</button>`).join('')}</div></div></div>
 <h3>Daily goals</h3><div class="grp">${row('Calories','gk','number','kcal',g.ak+' (auto)')}${row('Protein','gp','number','g',g.ap+' (auto)')}</div>
 <div class="cap" style="margin:8px 16px">Auto goals estimate maintenance calories and 1.8 g protein per kg. Enter your own to override.</div>
 <h3>Players on this phone</h3><div class="grp">${S.profiles.map(q=>`<div class="li"><div class="g"><b>${esc(q.name)}</b><small>${q.logs.length} exercises logged</small></div>${q.id===S.active?'<span class="mut">Active</span>':`<button class="tint" onclick="S.active='${q.id}';save();render()">Switch</button>`}</div>`).join('')}</div>
 <button class="btn alt" onclick="addP()">Add player</button>${S.profiles.length>1?'<button class="btn alt red" onclick="delP()">Delete this player</button>':''}
 <h3>Backup</h3><textarea class="tf" id="bk" rows="3" placeholder="Paste a backup here to import"></textarea>
 <div class="cap" style="margin:0 16px">Data is stored in this browser on this device.</div>
 <button class="btn alt" onclick="exp()">Export backup</button><button class="btn alt" onclick="imp()">Import backup</button>`;
}
function upd(k,v,re){const p=P();p[k]=v;if(k==='w'&&v){const t=today(),last=p.wl[p.wl.length-1];if(last&&last.d===t)last.w=+v;else p.wl.push({d:t,w:+v})}S.fresh=0;save();if(re||'name,w,h,age'.split(',').includes(k))render()}
function addP(){const n=prompt('Name for the new player?');if(!n)return;const p=np(n.trim().slice(0,24)||'Player');S.profiles.push(p);S.active=p.id;S.fresh=1;save();render()}
function delP(){if(!confirm('Delete '+P().name+' and all their data?'))return;S.profiles=S.profiles.filter(p=>p.id!==S.active);S.active=S.profiles[0].id;save();render()}
function exp(){const t=document.getElementById('bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}}
function imp(){try{const v=JSON.parse(document.getElementById('bk').value);if(!v.profiles||!v.profiles.length)throw 0;if(!confirm('Replace all data on this device with the backup?'))return;v.profiles.forEach(norm);S=v;save();render()}catch(e){alert('That backup could not be read. Export again and paste the whole text.')}}

/* ---------- theme ---------- */
const THEMES=[['vice','Vice City','linear-gradient(135deg,#ff375f,#ff9f0a)'],['keys','Keys','linear-gradient(135deg,#00d4c4,#ffb199)'],['neon','Neon','linear-gradient(135deg,#b45cff,#2de2e6)'],['black','Black','linear-gradient(135deg,#0a84ff,#000)'],['grey','Grey','linear-gradient(135deg,#ff9f0a,#48484a)']];
const BGS=[['solid','Solid'],['glow','Glow'],['grid','Grid']];
let TH={t:'vice',b:'glow'};try{Object.assign(TH,JSON.parse(localStorage.getItem('vicegym:theme')))}catch(e){}
function applyTheme(){const r=document.documentElement;r.dataset.theme=TH.t;r.dataset.bg=TH.b;try{localStorage.setItem('vicegym:theme',JSON.stringify(TH))}catch(e){}const m=document.querySelector('meta[name=theme-color]'),c=getComputedStyle(r).getPropertyValue('--bg').trim();if(m&&c)m.content=c}
function setTheme(t){TH.t=t;applyTheme();render()}
function setBg(b){TH.b=b;applyTheme();render()}

/* ---------- shell ---------- */
const ICON={today:'<path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/>',plan:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',food:'<path d="M7 3v7a2 2 0 0 0 4 0V3M9 3v18M17 21V3c-2.5 1.5-3 5-3 8h3"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
function render(){
 const v={today:viewToday,plan:viewPlan,food:viewFood,profile:viewProfile}[tab]();
 document.getElementById('app').innerHTML=v;
 document.getElementById('nav').innerHTML=[['today','Today'],['plan','Plan'],['food','Food'],['profile','Profile']].map(([k,n])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${n}</button>`).join('');
}
document.getElementById('app').addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('[data-m]');if(m)openLog({m:m.dataset.m})});
if(S.fresh)tab='profile';
applyTheme();render();
setTimeout(()=>{const b=document.getElementById('boot');b.style.opacity=0;setTimeout(()=>b.remove(),320)},2000);
</script>
</body>
</html>
